<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Tema 4 — Ley del Consell (Ley 5/1983) | Opositar en Valencia</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --naranja: #d97706;
    --naranja-claro: #fef3c7;
    --naranja-borde: #f59e0b;
    --azul-oscuro: #1e293b;
    --texto: #374151;
    --texto-suave: #6b7280;
    --borde: #e5e7eb;
    --fondo: #fafaf9;
    --blanco: #ffffff;
    --verde: #166534;
    --verde-bg: #f0fdf4;
    --verde-borde: #86efac;
    --rojo: #991b1b;
    --rojo-bg: #fef2f2;
    --rojo-borde: #fca5a5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Source Sans 3', sans-serif; background: var(--fondo); color: var(--texto); min-height: 100vh; font-size: 16px; line-height: 1.6; }
  header { background: var(--blanco); border-bottom: 1px solid var(--borde); padding: 0; }
  .header-top { max-width: 860px; margin: 0 auto; padding: 1.4rem 1.5rem 1rem; display: flex; align-items: flex-start; gap: 1.2rem; }
  .header-logo { width: 48px; height: 48px; border-radius: 8px; object-fit: contain; flex-shrink: 0; }
  .header-textos { flex: 1; }
  .header-site { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--naranja); font-weight: 600; margin-bottom: 3px; }
  .header-titulo { font-family: 'Lora', serif; font-size: clamp(1.25rem, 3.5vw, 1.75rem); font-weight: 700; color: var(--azul-oscuro); line-height: 1.2; }
  .header-sub { font-size: 0.88rem; color: var(--texto-suave); margin-top: 4px; }
  .header-meta { background: var(--naranja-claro); border-top: 1px solid #fde68a; padding: 0.55rem 1.5rem; }
  .header-meta-inner { max-width: 860px; margin: 0 auto; display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap; font-size: 0.83rem; color: #92400e; font-weight: 500; }
  .barra-wrap { position: sticky; top: 0; z-index: 100; background: var(--blanco); border-bottom: 1px solid var(--borde); padding: 0.6rem 1.5rem; box-shadow: 0 1px 6px rgba(0,0,0,0.05); }
  .barra-inner { max-width: 860px; margin: 0 auto; display: flex; align-items: center; gap: 1rem; }
  .barra-track { flex: 1; height: 6px; background: #f3f4f6; border-radius: 99px; overflow: hidden; }
  .barra-fill { height: 100%; background: var(--naranja); border-radius: 99px; transition: width 0.35s ease; width: 0%; }
  .barra-num { font-size: 13px; font-weight: 600; color: var(--azul-oscuro); white-space: nowrap; min-width: 52px; }
  .barra-score { font-size: 13px; color: var(--texto-suave); white-space: nowrap; }
  .barra-score .ok { color: var(--verde); font-weight: 600; }
  .barra-score .ko { color: var(--rojo); font-weight: 600; }
  main { max-width: 860px; margin: 0 auto; padding: 2rem 1.5rem 5rem; }
  .card { background: var(--blanco); border: 1px solid var(--borde); border-radius: 10px; padding: 1.5rem 1.6rem; margin-bottom: 1.4rem; transition: box-shadow 0.2s; }
  .card:hover { box-shadow: 0 3px 14px rgba(0,0,0,0.06); }
  .card-num { font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--naranja); margin-bottom: 0.5rem; }
  .card-pregunta { font-family: 'Lora', serif; font-size: 1rem; font-weight: 600; line-height: 1.55; color: var(--azul-oscuro); margin-bottom: 1.1rem; }
  .opciones { display: flex; flex-direction: column; gap: 0.45rem; }
  .opcion { display: flex; align-items: flex-start; gap: 0.7rem; padding: 0.7rem 1rem; border: 1.5px solid var(--borde); border-radius: 7px; cursor: pointer; background: var(--blanco); text-align: left; font-family: 'Source Sans 3', sans-serif; font-size: 0.93rem; color: var(--texto); line-height: 1.5; transition: border-color 0.15s, background 0.15s; width: 100%; }
  .opcion:hover:not(:disabled) { border-color: var(--naranja-borde); background: var(--naranja-claro); }
  .opcion .letra { font-weight: 700; color: var(--naranja); min-width: 18px; font-size: 0.85rem; margin-top: 2px; flex-shrink: 0; }
  .opcion.correcta { border-color: var(--verde-borde); background: var(--verde-bg); color: var(--verde); }
  .opcion.correcta .letra { color: #15803d; }
  .opcion.incorrecta { border-color: var(--rojo-borde); background: var(--rojo-bg); color: var(--rojo); }
  .opcion.incorrecta .letra { color: var(--rojo); }
  .opcion:disabled { cursor: default; }
  .explicacion { display: none; margin-top: 1rem; padding: 0.9rem 1rem 0.9rem 1.1rem; background: #fffbeb; border-left: 3px solid var(--naranja); border-radius: 0 6px 6px 0; font-size: 0.875rem; line-height: 1.65; color: var(--texto); }
  .explicacion.visible { display: block; animation: fadeIn 0.22s ease; }
  .explicacion strong { color: var(--azul-oscuro); }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
  .resultado { display: none; background: var(--blanco); border: 1px solid var(--borde); border-radius: 12px; padding: 2.5rem 2rem 2rem; margin: 1.5rem 0 2rem; text-align: center; }
  .resultado.visible { display: block; animation: fadeIn 0.3s ease; }
  .resultado-eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: var(--naranja); font-weight: 600; margin-bottom: 0.5rem; }
  .resultado h2 { font-family: 'Lora', serif; font-size: 1.75rem; font-weight: 700; color: var(--azul-oscuro); margin-bottom: 0.3rem; }
  .resultado-nota { font-size: 3.2rem; font-weight: 700; color: var(--azul-oscuro); line-height: 1; margin: 1rem 0 0.3rem; font-family: 'Lora', serif; }
  .resultado-nota span { color: var(--naranja); }
  .calif-badge { display: inline-block; padding: 5px 16px; border-radius: 99px; font-size: 0.9rem; font-weight: 600; margin: 0.6rem 0 1.5rem; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin: 0 0 1.5rem; }
  .stat { background: var(--fondo); border: 1px solid var(--borde); border-radius: 8px; padding: 0.9rem 0.5rem; }
  .stat-num { font-size: 1.9rem; font-weight: 700; font-family: 'Lora', serif; }
  .stat-lab { font-size: 0.78rem; color: var(--texto-suave); margin-top: 2px; }
  .resultado-hint { font-size: 0.85rem; color: var(--texto-suave); margin-bottom: 1.2rem; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 0.7rem 1.6rem; border-radius: 7px; font-family: 'Source Sans 3', sans-serif; font-size: 0.95rem; font-weight: 600; cursor: pointer; border: none; transition: all 0.18s; text-decoration: none; }
  .btn-naranja { background: var(--naranja); color: white; }
  .btn-naranja:hover { background: #b45309; transform: translateY(-1px); }
  .divider { text-align: center; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--texto-suave); margin: 2rem 0 1.5rem; display: flex; align-items: center; gap: 1rem; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--borde); }
  @media (max-width: 580px) { main { padding: 1.2rem 1rem 4rem; } .card { padding: 1.1rem 1.1rem; } .stats { grid-template-columns: 1fr 1fr; } .header-top { padding: 1rem; gap: 0.8rem; } .header-meta { padding: 0.5rem 1rem; } }
</style>
</head>

    <img class="header-logo"
      src="https://opositorgva.wordpress.com/wp-content/uploads/2024/04/cropped-opositar-en-valencia-logo-sin-fondo.png"
      alt="Opositar en Valencia"
      onerror="this.style.display='none'">
    <div class="header-textos">
      <div class="header-site">Opositar en Valencia · GVA</div>
      <div class="header-titulo">Tema 4 — La Ley del Consell (Ley 5/1983)</div>

    </div>

  <div class="header-meta">

</header>

<div class="barra-wrap">
  <div class="barra-inner">
    <div class="barra-track"><div class="barra-fill" id="barraFill"></div></div>

<main id="mainContent"></main>

<script>
const BANCO = [
  {
    p: "Según el artículo 1 de la Ley del Consell, ¿qué doble condición ostenta el President de la Generalitat?",
    ops: ["President de la Generalitat y President de Les Corts Valencianes", "President de la Generalitat y también President del Consell", "President de la Generalitat y Jefe de la Administración autonómica", "President de la Generalitat y representante del Estado en materia de seguridad"],
    c: 1,
    exp: "<strong>Respuesta correcta: B.</strong> El art. 1 de la Ley del Consell establece que el President de la Generalitat es también President del Consell. En esa doble condición dirige la acción del Consell, coordina sus funciones y ostenta la más alta representación de la Comunitat Valenciana, así como la ordinaria del Estado en ésta."
  },
  {
    p: "De acuerdo con el artículo 2.2 de la Ley del Consell, ¿quién propone el candidato a la presidencia de la Generalitat tras la renovación de Les Corts?",
    ops: ["El Presidente del Gobierno del Estado, previo acuerdo del Senado", "El Presidente de Les Corts, previa consulta con los representantes de los grupos políticos con representación parlamentaria", "El Consell en funciones, por acuerdo adoptado en sesión extraordinaria", "El grupo parlamentario con mayor número de escaños, de forma automática"],
    c: 1,
    exp: "<strong>Respuesta correcta: B.</strong> El art. 2.2 de la Ley del Consell atribuye al Presidente de Les Corts, previa consulta con los representantes de los grupos políticos, la función de proponer un candidato a la presidencia de la Generalitat, dando prioridad a quien haya obtenido mayor apoyo en dichas consultas."
  },
  {
    p: "Según el artículo 2.4 de la Ley del Consell, ¿qué mayoría es necesaria en primera votación para la elección del President de la Generalitat?",
    ops: ["Mayoría simple de los miembros de derecho de Les Corts", "Mayoría de tres quintos de los miembros de derecho de Les Corts", "Mayoría absoluta de los miembros de derecho de Les Corts", "Mayoría de dos tercios de los miembros de derecho de Les Corts"],
    c: 2,
    exp: "<strong>Respuesta correcta: C.</strong> El art. 2.4 de la Ley del Consell exige mayoría absoluta de los miembros de derecho de Les Corts en primera votación. Si no se logra, la votación se repite cuarenta y ocho horas después siendo suficiente la mayoría simple. Este esquema replica el modelo constitucional del art. 99.3 CE."
  },
  {
    p: "¿Qué ocurre si, pasados dos meses desde la primera votación de investidura, ningún candidato obtiene la confianza de Les Corts, según el artículo 2.6 de la Ley del Consell?",
    ops: ["El Consell en funciones convoca un referéndum autonómico", "El Presidente de Les Corts, por acuerdo de la Mesa, disuelve la Cámara y el President en funciones convoca nuevas elecciones", "El Gobierno del Estado designa un President provisional mediante Real Decreto", "El Tribunal Superior de Justicia de la Comunitat Valenciana asume las funciones ejecutivas de forma transitoria"],
    c: 1,
    exp: "<strong>Respuesta correcta: B.</strong> El art. 2.6 de la Ley del Consell establece que si transcurridos dos meses desde la primera votación ningún candidato obtiene la confianza, el Presidente de Les Corts, por acuerdo de la Mesa, disolverá la Cámara y el President en funciones convocará nuevas elecciones. Es la solución ante el bloqueo institucional."
  },
  {
    p: "Conforme al artículo 3 de la Ley del Consell, ¿en qué plazo debe publicarse el nombramiento del President elegido?",
    ops: ["En el plazo de cinco días en el BOE y el DOCV", "En el plazo de diez días en el «Boletín Oficial del Estado» y en el «Diari Oficial de la Comunitat Valenciana»", "En el plazo de quince días exclusivamente en el DOCV", "En el plazo de veinte días hábiles en ambos diarios oficiales"],
    c: 1,
    exp: "<strong>Respuesta correcta: B.</strong> El art. 3 de la Ley del Consell establece que, elegido el President, el Presidente de Les Corts lo comunicará al Rey para su nombramiento, y dicho nombramiento se publicará en el BOE y en el Diari Oficial de la Comunitat Valenciana en el plazo de diez días."
  },
  {
    p: "¿Desde qué momento empieza a ejercer sus funciones el President electo, según el artículo 4 de la Ley del Consell?",
    ops: ["Desde el día de su elección por Les Corts", "Desde el día de la publicación en el BOE de su nombramiento por el Rey", "Desde el día en que presta juramento o promesa ante Les Corts", "Desde el día siguiente a la publicación en el DOCV"],
    c: 1,
    exp: "<strong>Respuesta correcta: B.</strong> El art. 4 de la Ley del Consell establece que el President electo comenzará a ejercer sus funciones a partir del día de la publicación en el «Boletín Oficial del Estado» de su nombramiento por el Rey. Esta fecha es el dies a quo del mandato efectivo."
  },
  {
    p: "Según el artículo 5 de la Ley del Consell, ¿qué acto debe realizar el President tras su nombramiento y qué trámite tiene ese acto?",
    ops: ["Prometer o jurar acatar la Constitución y el Estatuto en las primeras Corts celebradas en Valencia, y efectuar una «Proposición» de su programa sin debate", "Presentar su programa de gobierno ante el Congreso de los Diputados para su ratificación", "Firmar el acta de toma de posesión ante el Tribunal Superior de Justicia de la CV", "Someter su programa al debate de investidura en una segunda sesión parlamentaria"],
    c: 0,
    exp: "<strong>Respuesta correcta: A.</strong> El art. 5 de la Ley del Consell establece que el President debe prometer o jurar acatar la Constitución y el Estatuto de Autonomía en las primeras Corts celebradas en Valencia tras su nombramiento. En ese mismo acto efectuará una «Proposición» de su programa de gobierno sin que sea objeto de debate."
  },
  {
    p: "¿Con qué actividades es incompatible el cargo de President de la Generalitat, según el artículo 6 de la Ley del Consell?",
    ops: ["Con cualquier cargo público, incluida la condición de Diputado de Les Corts", "Con cualquier función pública que no derive de su cargo (excepto la de Diputado de Les Corts) y con cualquier actividad profesional o mercantil", "Solo con actividades empresariales o mercantiles de carácter privado", "Con cualquier cargo de representación en organismos internacionales"],
    c: 1,
    exp: "<strong>Respuesta correcta: B.</strong> El art. 6 de la Ley del Consell establece que el cargo de President es incompatible con el ejercicio de cualquier otra función pública que no derive del cargo, excepto la de Diputado de Les Corts, y también con cualquier actividad profesional o mercantil. La condición de Diputado es la única excepción expresa."
  },
  {
    p: "¿Ante quién es políticamente responsable el President de la Generalitat, según el artículo 7 de la Ley del Consell?",
    ops: ["Ante el Gobierno del Estado y ante Les Corts de forma conjunta", "Ante Les Corts Valencianes", "Ante el pueblo valenciano directamente, mediante referéndum de revocación", "Ante el Consell en pleno"],
    c: 1,
    exp: "<strong>Respuesta correcta: B.</strong> El art. 7 de la Ley del Consell establece con claridad que el President de la Generalitat es responsable políticamente ante Les Corts Valencianes. Esta responsabilidad se canaliza principalmente a través de la moción de censura y la cuestión de confianza previstas en el Estatuto de Autonomía."
  },
  {
    p: "El artículo 8 de la Ley del Consell enumera las causas de cese del President. ¿Cuál de las siguientes NO figura entre ellas?",
    ops: ["Por renovación de Les Corts a consecuencia de unas elecciones autonómicas", "Por aprobación de una moción de censura", "Por disolución voluntaria del Consell acordada por mayoría absoluta de sus miembros", "Por fallecimiento"],
    c: 2,
    exp: "<strong>Respuesta correcta: C.</strong> El art. 8 de la Ley del Consell enumera las causas de cese: renovación de Les Corts, moción de censura, denegación de cuestión de confianza, dimisión o renuncia, pérdida de la condición de Diputado, incompatibilidad no subsanada en diez días, incapacidad permanente declarada por Les Corts y fallecimiento. La disolución del Consell por sus propios miembros no existe como causa."
  },
  {
    p: "Según el artículo 8 de la Ley del Consell, ¿qué plazo tiene el President para subsanar una incompatibilidad declarada por Les Corts antes de que se produzca su cese?",
    ops: ["Cinco días", "Diez días", "Quince días", "Un mes"],
    c: 1,
    exp: "<strong>Respuesta correcta: B.</strong> El art. 8.f) de la Ley del Consell establece como causa de cese la incompatibilidad declarada por Les Corts y no subsanada en el plazo de diez días. Este plazo otorga al President la posibilidad de corregir la situación de incompatibilidad antes de que se consume el cese."
  },
  {
    p: "En los supuestos de incapacidad o fallecimiento del President, ¿quién asume sus funciones como más alto representante de la Comunitat y representante ordinario del Estado, según el artículo 8 de la Ley del Consell?",
    ops: ["El Conseller más antiguo en el cargo", "El Presidente de Les Corts", "El Vicepresidente primero del Consell", "El Secretario del Consell"],
    c: 1,
    exp: "<strong>Respuesta correcta: B.</strong> El art. 8 de la Ley del Consell establece que en los supuestos de incapacidad y fallecimiento, el Presidente de Les Corts asume las funciones del President como más alto representante de la Comunitat Valenciana y representante ordinario del Estado. Las funciones de President del Consell recaen en los Vicepresidentes según su orden."
  },
  {
    p: "¿Cuál es el tratamiento protocolario que corresponde al President de la Generalitat según el artículo 9 de la Ley del Consell?",
    ops: ["Excelentísimo señor", "Muy Honorable", "Ilustrísimo señor", "Honorable señor"],
    c: 1,
    exp: "<strong>Respuesta correcta: B.</strong> El art. 9.a) de la Ley del Consell establece que el President de la Generalitat gozará del tratamiento de «muy honorable». Este tratamiento es el que distingue al máximo representante institucional de la Comunitat Valenciana y difiere del tratamiento de «honorable» que corresponde a los Consellers (art. 30.2)."
  },
  {
    p: "Conforme al artículo 9 de la Ley del Consell, ¿qué prerrogativa tiene el President en cuanto a presidir actos?",
    ops: ["Presidir únicamente los actos celebrados en la ciudad de Valencia", "Presidir todos los actos celebrados en el territorio de la Comunitat Valenciana a los que concurra, salvo lo dispuesto en la legislación del Estado", "Presidir los actos de las instituciones de la Generalitat, pero no los del Estado en la Comunitat", "Presidir los actos protocolarios siempre que no concurra ninguna autoridad del Estado"],
    c: 1,
    exp: "<strong>Respuesta correcta: B.</strong> El art. 9.c) de la Ley del Consell establece que el President tiene la prerrogativa de presidir todos los actos celebrados en el territorio de la Comunitat Valenciana a los que concurra, salvo lo dispuesto en la legislación del Estado. Esta regla refleja la prelación protocolaria del President en su territorio."
  },
  {
    p: "Según el artículo 10 de la Ley del Consell, ¿a quién corresponde firmar los Convenios y Acuerdos de cooperación con la Administración del Estado y las demás CCAA?",
    ops: ["Al Conseller competente por razón de la materia del convenio", "Al President de la Generalitat", "Al Secretario del Consell, como fedatario de los acuerdos del Ejecutivo", "Al Consell en pleno, mediante acuerdo adoptado por mayoría absoluta"],
    c: 1,
    exp: "<strong>Respuesta correcta: B.</strong> El art. 10.c) de la Ley del Consell atribuye al President de la Generalitat la función de firmar los Convenios y Acuerdos de cooperación con la Administración del Estado y las demás Comunidades Autónomas. Es una competencia propia del President como representante de la Comunitat."
  },
  {
    p: "¿Qué función le atribuye el artículo 11 de la Ley del Consell al President como representante ordinario del Estado en la Comunitat Valenciana?",
    ops: ["Ejecutar las sentencias del Tribunal Constitucional en el territorio valenciano", "Promulgar, en nombre del Rey, las Leyes de la Generalitat y disponer su publicación en el DOCV en el plazo de quince días de su aprobación", "Coordinar la actuación de las Fuerzas y Cuerpos de Seguridad del Estado en la Comunitat", "Ejercer el veto suspensivo sobre las leyes de Les Corts que vulneren competencias estatales"],
    c: 1,
    exp: "<strong>Respuesta correcta: B.</strong> El art. 11 de la Ley del Consell establece que corresponde al President, en su condición de representante ordinario del Estado, promulgar en nombre del Rey las Leyes de la Generalitat y disponer lo necesario para su publicación en el DOCV en el plazo de quince días de su aprobación, y también en el BOE."
  },
  {
    p: "Según el artículo 12.1 de la Ley del Consell, ¿cuál de las siguientes es una atribución del President en su condición de director y coordinador del Consell?",
    ops: ["Aprobar los Presupuestos de la Generalitat y presentarlos a Les Corts", "Crear, modificar y suprimir las Consellerías y las Secretarías Autonómicas", "Nombrar a los magistrados del Tribunal Superior de Justicia de la CV", "Ejercer la potestad reglamentaria mediante Órdenes de la Presidencia"],
    c: 1,
    exp: "<strong>Respuesta correcta: B.</strong> El art. 12.1.b) de la Ley del Consell atribuye al President la facultad de crear, modificar y suprimir las Consellerías y las Secretarías Autonómicas. Esta competencia organizativa es nuclear en su función de dirección del Gobierno autonómico y le permite adaptar la estructura del Ejecutivo a las necesidades políticas."
  },
  {
    p: "¿A quién corresponde resolver los conflictos de atribuciones entre las distintas Consellerías, según el artículo 12.1 de la Ley del Consell?",
    ops: ["Al Consell Jurídic Consultiu de la Comunitat Valenciana", "Al Secretario del Consell, como órgano de coordinación administrativa", "Al President de la Generalitat", "Al Tribunal Superior de Justicia de la Comunitat Valenciana"],
    c: 2,
    exp: "<strong>Respuesta correcta: C.</strong> El art. 12.1.j) de la Ley del Consell atribuye al President la facultad de resolver los conflictos de atribuciones entre las distintas Consellerías. Esta competencia es coherente con su función de dirección y coordinación del Consell y evita que los conflictos entre departamentos paralicen la acción del Gobierno."
  },
  {
    p: "Conforme al artículo 12.1.m) de la Ley del Consell, ¿qué requisito previo se exige para que el President pueda disolver Les Corts y convocar elecciones?",
    ops: ["La autorización de Les Corts por mayoría absoluta", "El previo acuerdo del Consell", "La propuesta del Presidente de Les Corts", "La comunicación previa al Delegado del Gobierno en la Comunitat"],
    c: 1,
    exp: "<strong>Respuesta correcta: B.</strong> El art. 12.1.m) de la Ley del Consell establece que el President puede disolver Les Corts y convocar elecciones previo acuerdo del Consell. Este requisito de deliberación colectiva refuerza el carácter colegiado del Ejecutivo autonómico y garantiza que la disolución no sea una decisión unilateral del President."
  },
  {
    p: "Según el artículo 13 de la Ley del Consell, ¿cuál es la definición legal del Consell?",

// ── ALEATORIZACIÓN ──
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function prepararPreguntas() {
  const mezcladas = shuffle(BANCO);
  return mezcladas.map(q => {
    const respuestaTextoCorrecta = q.ops[q.c];
    const opsNuevas = shuffle(q.ops);
    const nuevoC = opsNuevas.indexOf(respuestaTextoCorrecta);
    return { p: q.p, ops: opsNuevas, c: nuevoC, exp: q.exp };
  });
}

let preguntas = [];
let respondidas = 0, correctas = 0, incorrectas = 0;

function actualizarBarra() {
  const pct = preguntas.length ? (respondidas / preguntas.length) * 100 : 0;
  document.getElementById('barraFill').style.width = pct + '%';
  document.getElementById('barraNum').textContent = respondidas + ' / ' + preguntas.length;
  document.getElementById('scoreOk').textContent = '✓ ' + correctas;
  document.getElementById('scoreKo').textContent = '✗ ' + incorrectas;
}

function responder(qi, oi) {
  const q = preguntas[qi];
  const btns = document.querySelectorAll('[data-qi="' + qi + '"]');
  btns.forEach(b => b.disabled = true);
  btns.forEach((b, j) => {
    if (j === q.c) b.classList.add('correcta');
    else if (j === oi && oi !== q.c) b.classList.add('incorrecta');
  });
  document.getElementById('exp-' + qi).classList.add('visible');
  respondidas++;
  if (oi === q.c) correctas++; else incorrectas++;
  actualizarBarra();
  if (respondidas === preguntas.length) setTimeout(mostrarResultado, 700);
}

function mostrarResultado() {
  const pct = Math.round((correctas / preguntas.length) * 100);
  document.getElementById('resPunt').innerHTML = correctas + ' <span>/ ' + preguntas.length + '</span>';
  document.getElementById('resCorr').textContent = correctas;
  document.getElementById('resIncorr').textContent = incorrectas;
  document.getElementById('resPct').textContent = pct + '%';

  let txt, col, bg;
  if (pct >= 90)      { txt = '🏆 Sobresaliente'; col = '#166534'; bg = '#f0fdf4'; }
  else if (pct >= 75) { txt = '✅ Notable';        col = '#1e3a5f'; bg = '#eff6ff'; }
  else if (pct >= 60) { txt = '📘 Aprobado';       col = '#92400e'; bg = '#fffbeb'; }
  else                { txt = '❌ Insuficiente — ¡Sigue practicando!'; col = '#991b1b'; bg = '#fef2f2'; }

  document.getElementById('resCalif').innerHTML =
    '<span class="calif-badge" style="background:' + bg + ';color:' + col + '">' + txt + '</span>';

  const el = document.getElementById('resultado');
  el.classList.add('visible');
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function render() {
  respondidas = 0; correctas = 0; incorrectas = 0;
  preguntas = prepararPreguntas();
  actualizarBarra();

  const main = document.getElementById('mainContent');
  main.innerHTML = '';
  const letras = ['A','B','C','D'];

  preguntas.forEach((q, i) => {
    const card = document.createElement('div');
    card.className = 'card';

    const opsHTML = q.ops.map((op, j) =>
      `<button class="opcion" data-qi="${i}" onclick="responder(${i},${j})">
        <span class="letra">${letras[j]})</span><span>${op}</span>
      </button>`
    ).join('');

    card.innerHTML =
      `<div class="card-num">Pregunta ${i + 1} de ${preguntas.length}</div>
       <div class="card-pregunta">${q.p}</div>
       <div class="opciones">${opsHTML}</div>
       <div class="explicacion" id="exp-${i}">${q.exp}</div>`;

    main.appendChild(card);
  });

  const sep = document.createElement('div');
  sep.className = 'divider';
  sep.textContent = 'Fin del test';
  main.appendChild(sep);

  const res = document.createElement('div');
  res.className = 'resultado';
  res.id = 'resultado';
  res.innerHTML =
    `<div class="resultado-eyebrow">Resultado final</div>
     <h2>Test completado</h2>
     <div class="resultado-nota" id="resPunt">0 <span>/ 50</span></div>
     <div id="resCalif"></div>
     <div class="stats">
       <div class="stat"><div class="stat-num" id="resCorr" style="color:#166534">0</div><div class="stat-lab">Correctas</div></div>
       <div class="stat"><div class="stat-num" id="resIncorr" style="color:#991b1b">0</div><div class="stat-lab">Incorrectas</div></div>
       <div class="stat"><div class="stat-num" id="resPct">0%</div><div class="stat-lab">% aciertos</div></div>
     </div>
     <p class="resultado-hint">Desplázate hacia arriba para revisar las explicaciones de cada pregunta.</p>
     <button class="btn btn-naranja" onclick="render(); window.scrollTo({top:0,behavior:'smooth'})">↺ Repetir con nuevo orden</button>`;
  main.appendChild(res);
}

render();
</script>
